<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKERSPACE@UTHM PBL Guide Hub</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #090d16; margin: 0; color: #f3f4f6; }
    header { background: #111827; padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: center; gap: 15px; border-bottom: 4px solid #d92525; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    header img { height: 55px; }
    header h1 { margin: 0; font-size: 1.7rem; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
    
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    
    .card { background: #1f2937; border-radius: 8px; overflow: hidden; border: 1px solid #374151; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #2563eb; }
    .img-wrapper { width: 100%; height: 200px; background: #0f172a; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #374151; }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-body { padding: 1.2rem; text-align: center; }
    .card h3 { margin: 0 0 0.8rem 0; font-size: 1.15rem; color: #ffffff; }
    
    .badges { display: flex; justify-content: center; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
    .badge { background: #374151; color: #9ca3af; font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    .badge.active { background: #1e3a8a; color: #93c5fd; border: 1px solid #2563eb; }
    
    .btn { display: inline-block; width: 100%; background: #2563eb; color: #fff; padding: 0.7rem; text-decoration: none; border-radius: 6px; font-weight: 600; text-align: center; box-sizing: border-box; }
    .btn:hover { background: #1d4ed8; }
    .loading { text-align: center; font-size: 1.2rem; color: #9ca3af; margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="MAKERSPACE Logo">
    <h1>MAKERSPACE@UTHM PBL GUIDES</h1>
  </header>

  <div class="container">
    <div id="status" class="loading">Loading Project Guides from Drive...</div>
    <div class="catalog" id="catalog-container"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzemGueSjyuhgWZ_9eryBn9hY80u53UG3hWyyoXVLnxG1JdKykfvcgqlgXBwtdXgxp1Fw/exec";

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').style.display = 'none';
        sessionStorage.setItem('makerspace_projects', JSON.stringify(data));
        
        const container = document.getElementById('catalog-container');
        data.forEach((proj, idx) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="img-wrapper"><img src="${proj.coverUrl}" alt="${proj.title}"></div>
            <div class="card-body">
              <h3>${proj.title}</h3>
              <div class="badges">
                <span class="badge ${proj.tutorialPages.length ? 'active':''}">📚 Guide (${proj.tutorialPages.length}p)</span>
                <span class="badge ${proj.components.length ? 'active':''}">🧩 ${proj.components.length} Parts</span>
                <span class="badge ${proj.stlFiles.length ? 'active':''}">📦 ${proj.stlFiles.length} STL</span>
                <span class="badge ${proj.makecodeUrl || proj.makecodeHexUrl ? 'active':''}">💻 MakeCode</span>
              </div>
              <a class="btn" href="viewer.html?id=${idx}">Start Project Guide</a>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('status').innerText = 'Failed to load projects. Check Apps Script URL or permissions.';
      });
  </script>
</body>
</html>
