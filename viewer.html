<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>MAKERSPACE@UTHM Hub</title>

  <!-- BROWSER TAB LOGO (FAVICON) -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Swiper JS & Three.js Engine -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0b0f19; color: white; font-family: sans-serif; display: flex; flex-direction: column; }

    header { height: 60px; background: #111827; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d92525; flex-shrink: 0; }
    header a { color: #fff; text-decoration: none; font-weight: bold; background: #374151; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; }
    #project-title { font-size: 1rem; font-weight: bold; color: #f3f4f6; }

    .tab-bar { height: 50px; background: #1f2937; display: flex; justify-content: center; gap: 8px; border-bottom: 1px solid #374151; align-items: center; overflow-x: auto; flex-shrink: 0; }
    .tab-btn { background: #374151; color: #9ca3af; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: all 0.2s; white-space: nowrap; }
    .tab-btn.active { background: #2563eb; color: white; }

    .stage { flex: 1; position: relative; overflow: hidden; background: #0b0f19; }
    
    .view-panel { width: 100%; height: 100%; display: none; flex-direction: column; }
    .view-panel.active { display: flex; }

    /* 1. Tutorial Swiper & Progress Bar */
    .tutorial-header { padding: 10px 15px; display: flex; align-items: center; gap: 15px; background: #1f2937; border-bottom: 1px solid #374151; flex-shrink: 0; }
    .progress-bar-container { flex: 1; height: 8px; background: #374151; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #4ade80; width: 0%; transition: width 0.3s ease; }
    #slide-counter { color: #9ca3af; font-size: 0.85rem; font-weight: bold; min-width: 80px; text-align: right; }
    
    .swiper { width: 100%; flex: 1; }
    .swiper-slide { display: flex; align-items: center; justify-content: center; padding: 10px; }
    .swiper-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
    .side-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(37, 99, 235, 0.45); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; z-index: 20; }
    .side-nav-prev { left: 15px; } .side-nav-next { right: 15px; }

    /* 2. Components List Panel */
    .components-container { width: 100%; max-width: 800px; height: 100%; overflow-y: auto; padding: 1.5rem; margin: 0 auto; }
    .component-card { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .component-info h4 { margin: 0 0 4px 0; color: #f9fafb; font-size: 0.95rem; }
    .component-info span { color: #9ca3af; font-size: 0.8rem; }
    .buy-btn { background: #16a34a; color: white; padding: 6px 14px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.85rem; border:none; cursor:pointer; }
    .buy-btn:hover { background: #15803d; }

    /* 3. 3D STL Viewer Panel */
    #stl-canvas-container { width: 100%; height: 100%; position: relative; flex: 1; }
    .stl-sidebar { position: absolute; top: 15px; left: 15px; background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(8px); padding: 12px; border-radius: 8px; border: 1px solid #374151; max-width: 260px; z-index: 10; }
    .stl-sidebar select { width: 100%; background: #1f2937; color: white; border: 1px solid #4b5563; padding: 8px; border-radius: 4px; margin-bottom: 8px; }
    .download-stl-btn { display: block; width: 100%; background: #2563eb; color: white; text-align: center; padding: 8px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.85rem; margin-bottom: 6px; }
    #stl-status { font-size: 0.75rem; color: #60a5fa; margin-top: 6px; text-align: center; font-weight: bold; }

    /* 4. MakeCode Viewer Panel */
    .makecode-toolbar { height: 45px; width: 100%; background: #1f2937; display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; border-bottom: 1px solid #374151; flex-shrink: 0; }
    .hex-btn { background: #2563eb; color: white; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
    .edit-btn { background: #16a34a; color: white; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-size: 0.85rem; font-weight: bold; margin-left: 8px; }
    .edit-btn:hover { background: #15803d; }
    #makecode-wrapper { flex: 1; width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; }
    
    /* Code Switcher */
    .code-switcher { background: #1f2937; padding: 6px; text-align: center; border-bottom: 1px solid #374151; display: flex; justify-content: center; gap: 10px; align-items: center; }
    .code-toggle-btn { background: #374151; color: #9ca3af; border: none; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .code-toggle-btn.active { background: #d92525; color: white; box-shadow: 0 0 10px rgba(217, 37, 37, 0.4); }
  </style>
</head>
<body>

  <header>
    <a href="index.html">← Back to Catalog</a>
    <span id="project-title">Loading...</span>
    <span>MAKERSPACE@UTHM</span>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tutorial')">📚 Guide</button>
    <button class="tab-btn" onclick="switchTab('components')">🧩 Parts List & Links</button>
    <button class="tab-btn" onclick="switchTab('stl')">🛠️ 3D Parts (STL)</button>
    <button class="tab-btn" onclick="switchTab('makecode')">💻 MakeCode Program</button>
  </div>

  <div class="stage">
    
    <!-- PANEL 1: TUTORIAL GUIDE -->
    <div id="panel-tutorial" class="view-panel active">
      
      <!-- NEW PROGRESS BAR HEADER -->
      <div class="tutorial-header">
        <div class="progress-bar-container">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <span id="slide-counter">Step 0 of 0</span>
      </div>

      <div style="position: relative; flex: 1; display: flex;">
        <button class="side-nav-btn side-nav-prev" onclick="swiper.slidePrev()">❮</button>
        <button class="side-nav-btn side-nav-next" onclick="swiper.slideNext()">❯</button>
        <div class="swiper" id="swiper-container"><div class="swiper-wrapper" id="swiper-wrapper"></div></div>
      </div>
    </div>

    <!-- PANEL 2: PARTS LIST -->
    <div id="panel-components" class="view-panel">
      <div class="components-container" id="components-list">
        <p style="text-align: center; color: #9ca3af;">Loading required parts list...</p>
      </div>
    </div>

    <!-- PANEL 3: 3D STL VIEWER -->
    <div id="panel-stl" class="view-panel">
      <div id="stl-canvas-container">
        <div class="stl-sidebar">
          <label style="font-size: 0.8rem; color: #9ca3af;">Select 3D Part:</label>
          <select id="stl-select" onchange="loadSelectedSTL()"></select>
          <a id="download-stl-link" class="download-stl-btn" href="#" target="_blank">Download STL File</a>
          <div id="stl-status">Ready</div>
        </div>
      </div>
    </div>

    <!-- PANEL 4: MAKECODE VIEWER -->
    <div id="panel-makecode" class="view-panel">
      <div class="makecode-toolbar">
        <span style="font-size: 0.85rem; color: #9ca3af;">MakeCode Block Preview (Read-Only)</span>
        <div>
          <a id="hex-download-link" class="hex-btn" href="#" target="_blank" style="display:none;">Download .HEX</a>
          <a id="open-editor-link" class="edit-btn" href="#" target="_blank">✏️ Open & Edit Code</a>
        </div>
      </div>
      <div id="makecode-wrapper"></div>
    </div>
  </div>

  <script>
    // APPS SCRIPT URL:
    const API_URL = "https://script.google.com/macros/s/AKfycbyHIpqSz3wZT984jtw-TwQaxZJMwJwIdmAQg9Jz3_0IkdjTBRYjbtxnHWCK84K_MIxUTQ/exec";

    let swiper, scene, camera, renderer, controls, currentMesh;
    let makecodeProjects = [];
    let currentCodeIndex = 0;

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id')) || 0;
    const projects = JSON.parse(sessionStorage.getItem('makerspace_projects') || '[]');
    const project = projects[id];

    if (project) {
      document.getElementById('project-title').innerText = project.title;
      initTutorial();
      initComponentsList();
      init3DViewer();
      initMakeCodeViewer();
    } else {
      window.location.href = 'index.html';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      
      const targetPanel = document.getElementById('panel-' + tab);
      const targetBtn = document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`);
      
      if(targetPanel) targetPanel.classList.add('active');
      if(targetBtn) targetBtn.classList.add('active');
      
      if (tab === 'stl') {
        setTimeout(onWindowResize, 50); 
      } else if (tab === 'makecode') {
        const wrapper = document.getElementById('makecode-wrapper');
        if (wrapper.innerHTML.trim() === '') {
          renderMakeCodeIframe();
        }
      }
    }

    // 1. Tutorial Engine with Progress Bar
    function initTutorial() {
      const wrapper = document.getElementById('swiper-wrapper');
      if (!project.tutorialPages || !project.tutorialPages.length) {
        wrapper.innerHTML = '<div class="swiper-slide" style="color:#9ca3af;">No tutorial pages found in Drive.</div>';
        return;
      }
      
      const totalSlides = project.tutorialPages.length;
      
      project.tutorialPages.forEach(url => {
        wrapper.innerHTML += `<div class="swiper-slide"><img src="${url}"></div>`;
      });
      
      swiper = new Swiper('#swiper-container', { 
        speed: 400, 
        grabCursor: true,
        on: {
          init: function () {
            updateProgressBar(this.activeIndex, totalSlides);
          },
          slideChange: function () {
            updateProgressBar(this.activeIndex, totalSlides);
          }
        }
      });
    }

    function updateProgressBar(currentIndex, totalSlides) {
      const step = currentIndex + 1;
      const percentage = (step / totalSlides) * 100;
      document.getElementById('slide-counter').innerText = `Step ${step} of ${totalSlides}`;
      document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
    }

    // 2. Components List Engine
    function initComponentsList() {
      const container = document.getElementById('components-list');
      if (!project.components || !project.components.length) {
        container.innerHTML = '<p style="text-align: center; color: #9ca3af;">No parts text file uploaded for this project.</p>';
        return;
      }
      container.innerHTML = '<h3 style="margin-bottom: 1rem; color: #f3f4f6;">Required Hardware & Components</h3>';
      project.components.forEach(item => {
        const isStlRef = item.link.toLowerCase().includes('stl');
        const actionBtnHtml = isStlRef 
          ? `<button class="buy-btn" style="background:#2563eb;" onclick="switchTab('stl')">View 3D STL</button>`
          : `<a class="buy-btn" href="${item.link}" target="_blank">Buy / Link</a>`;

        container.innerHTML += `
          <div class="component-card">
            <div class="component-info">
              <h4>${item.name}</h4>
              <span>Est. Price: ${item.price}</span>
            </div>
            ${actionBtnHtml}
          </div>
        `;
      });
    }

    // 3. Three.js 3D STL Engine
    function init3DViewer() {
      const container = document.getElementById('stl-canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090d16);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(100, 100, 100);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(1, 1, 1).normalize();
      scene.add(dirLight1);
      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-1, -1, -1).normalize();
      scene.add(dirLight2);

      const stlSelect = document.getElementById('stl-select');
      if (project.stlFiles && project.stlFiles.length) {
        stlSelect.innerHTML = '';
        project.stlFiles.forEach((file, i) => {
          stlSelect.innerHTML += `<option value="${i}">${file.name}</option>`;
        });
        loadSelectedSTL();
      } else {
        stlSelect.innerHTML = '<option>No STL files found</option>';
        document.getElementById('stl-status').innerText = 'No models available';
      }

      window.addEventListener('resize', onWindowResize);
      animate3D();
    }

    function loadSelectedSTL() {
      const idx = document.getElementById('stl-select').value;
      const file = project.stlFiles[idx];
      const statusEl = document.getElementById('stl-status');
      if (!file) return;

      document.getElementById('download-stl-link').href = file.downloadUrl;
      statusEl.innerText = 'Extracting...';
      statusEl.style.color = '#60a5fa';

      const proxyUrl = API_URL + "?fileId=" + file.id;

      fetch(proxyUrl, { redirect: 'follow' })
        .then(res => res.text())
        .then(base64 => {
          if (base64 === "ERROR") throw new Error("File extraction failed");
          
          statusEl.innerText = 'Building 3D...';
          const buffer = base64ToArrayBuffer(base64);
          const loader = new THREE.STLLoader();
          const geometry = loader.parse(buffer);

          if (currentMesh) scene.remove(currentMesh);

          const material = new THREE.MeshPhongMaterial({ color: 0x2563eb, specular: 0x111111, shininess: 150 });
          currentMesh = new THREE.Mesh(geometry, material);

          geometry.center();
          currentMesh.rotation.x = -Math.PI / 2;
          scene.add(currentMesh);

          geometry.computeBoundingSphere();
          const radius = geometry.boundingSphere.radius || 50;
          camera.position.set(radius * 2.2, radius * 2.2, radius * 2.2);
          controls.target.set(0, 0, 0);

          statusEl.innerText = 'Model Loaded';
          statusEl.style.color = '#4ade80';
        })
        .catch(err => {
          console.error("STL Proxy Error:", err);
          statusEl.innerText = 'Failed';
          statusEl.style.color = '#f87171';
        });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('stl-canvas-container');
      if (renderer && container) {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      }
    }

    // 4. MULTI-MAKECODE PARSER LOGIC
    function initMakeCodeViewer() {
      const hexBtn = document.getElementById('hex-download-link');
      let rawText = project.makecodeUrl || "";

      if (rawText) {
        const matches = rawText.match(/(S\d{5}-\d{5}-\d{5}-\d{5}|_[a-zA-Z0-9]+)/g) || [];
        const uniqueCodes = [...new Set(matches)]; 

        makecodeProjects = uniqueCodes.map((code, index) => {
          let label = `Code ${index + 1}`;
          if (uniqueCodes.length === 2) {
            label = index === 0 ? "🎮 TX (Remote) Code" : "🤖 RX (Robot) Code";
          }
          return {
            code: code,
            label: label,
            url: `https://makecode.microbit.org/${code}`
          };
        });
      }

      if (project.makecodeHexUrl) {
        hexBtn.href = project.makecodeHexUrl;
        hexBtn.style.display = 'inline-block';
      }
    }

    function renderMakeCodeIframe() {
      const wrapper = document.getElementById('makecode-wrapper');
      const openEditorLink = document.getElementById('open-editor-link');

      if (makecodeProjects.length === 0) {
        wrapper.innerHTML = `
          <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; text-align:center;">
            <h3 style="color:#9ca3af;">No valid MakeCode link found.</h3>
            <p style="color:#6b7280; font-size:0.85rem;">Ensure a .txt file inside the Drive folder contains your valid share link.</p>
          </div>`;
        return;
      }

      const activeProject = makecodeProjects[currentCodeIndex];
      openEditorLink.href = activeProject.url;

      let switcherHTML = "";
      if (makecodeProjects.length > 1) {
        let buttons = makecodeProjects.map((p, i) => `
          <button class="code-toggle-btn ${i === currentCodeIndex ? 'active' : ''}" onclick="switchCodeView(${i})">
            ${p.label}
          </button>
        `).join('');
        switcherHTML = `<div class="code-switcher">${buttons}</div>`;
      }

      wrapper.innerHTML = `
        ${switcherHTML}
        <div style="background: #111827; padding: 8px; text-align: center; border-bottom: 1px solid #1f2937; flex-shrink:0;">
          <span style="color: #9ca3af; font-size: 0.85rem;">Preview mode. To modify variables or blocks, click </span>
          <a href="${activeProject.url}" target="_blank" style="color: #38bdf8; text-decoration: none; font-size: 0.85rem; font-weight: bold;">
            ✏️ Open Full Interactive Editor
          </a>
        </div>
        <iframe src="https://makecode.microbit.org/---codeembed#pub:${activeProject.code}" allowfullscreen="allowfullscreen" frameborder="0" style="flex:1; width:100%; height:100%; border:none; display:block;"></iframe>
      `;
    }

    function switchCodeView(index) {
      currentCodeIndex = index;
      renderMakeCodeIframe();
    }
  </script>
</body>
</html>
